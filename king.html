<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For the King ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070504;
    --ink2:#150f0b;
    --gold:#c9a24b;
    --gold-bright:#ecc972;
    --gold-dim:#8a6d2f;
    --crimson:#5e1216;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100dvh;
    overflow:hidden;
    background:
      radial-gradient(circle at 13% 86%, rgba(150,46,24,.22), transparent 34%),
      radial-gradient(ellipse at 50% 28%, #1d140f 0%, #0e0907 46%, var(--ink) 100%);
    color:var(--gold);
    font-family:"EB Garamond", Georgia, serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #sky{
    position:fixed; inset:0; z-index:0;
    width:100%; height:100%;
    pointer-events:none;
  }
  .stage{
    position:relative; z-index:2;
    min-height:100dvh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:clamp(1.6rem, 4vh, 2.8rem);
    padding:clamp(1.4rem, 5vh, 3rem) 1.2rem;
  }

  /* ---- portrait ---- */
  .portrait{
    position:relative;
    opacity:0; transform:translateY(14px) scale(.985);
    animation:rise 1.6s cubic-bezier(.2,.7,.2,1) .25s forwards;
  }
  .portrait img{
    display:block;
    width:min(78vw, 384px);
    height:auto;
    border-radius:5px;
    box-shadow:
      0 0 0 1px rgba(201,162,75,.40),
      0 0 46px rgba(201,162,75,.14),
      0 34px 90px rgba(0,0,0,.72);
  }
  .portrait::after{
    content:""; position:absolute; inset:0;
    border-radius:5px; pointer-events:none;
    box-shadow:inset 0 0 54px 14px rgba(7,5,4,.78);
  }
  .portrait::before{
    content:""; position:absolute; inset:-7%;
    border-radius:50%; pointer-events:none; z-index:-1;
    background:radial-gradient(circle, rgba(201,162,75,.10), transparent 62%);
  }

  /* ---- quote ---- */
  .quote{
    position:relative;
    margin:0; padding:.2rem .4rem;
    max-width:min(92vw, 30rem);
    min-height:5.2em;
    display:grid; place-items:center;
    font-family:"Cinzel", Georgia, serif;
    font-weight:500;
    font-size:clamp(1rem, 1rem + 1.4vw, 1.42rem);
    line-height:1.85;
    letter-spacing:.1em;
    text-align:center;
    cursor:pointer;
    opacity:0;
    animation:rise 1.7s cubic-bezier(.2,.7,.2,1) 1.05s forwards;
    outline:none;
  }
  .quote .line{
    grid-area:1 / 1;
    transition:opacity .75s ease;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, var(--gold-dim));
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 14px rgba(201,162,75,.20));
    animation:emberglow 7s ease-in-out infinite;
  }
  .quote .lang-de{opacity:0}
  .quote:hover .lang-en,
  .quote.is-flipped .lang-en{opacity:0}
  .quote:hover .lang-de,
  .quote.is-flipped .lang-de{opacity:1}
  .quote:focus-visible{
    box-shadow:0 0 0 1px rgba(201,162,75,.5);
    border-radius:8px;
  }

  @keyframes rise{
    to{opacity:1; transform:none}
  }
  @keyframes emberglow{
    0%,100%{filter:drop-shadow(0 0 12px rgba(201,162,75,.16))}
    50%{filter:drop-shadow(0 0 20px rgba(236,201,114,.30))}
  }

  @media (prefers-reduced-motion: reduce){
    .portrait,.quote{animation:none; opacity:1; transform:none}
    .quote .line{animation:none}
  }
</style>
</head>

      <span class="line lang-de" aria-hidden="true">Ein König trotzt den Stürmen,<br>und doch gedeiht sein Königreich —<br>weil er der Liebe Raum gegeben hat.</span>

<script>
(function(){
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  const GOLD = [236,201,114];
  const WHITE = [245,242,233];
  const rand = (a,b)=>a+Math.random()*(b-a);

  // ---- ambient starfield ----
  const COUNT = Math.round(Math.min(150, (W*H)/9000));
  const stars = [];
  for(let i=0;i<COUNT;i++){
    const gold = Math.random() < .32;
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: rand(.4,1.7),
      a: rand(.15,.85),
      tw: rand(.6,1.7),
      ph: rand(0,Math.PI*2),
      vy: rand(.04,.22),
      col: gold ? GOLD : WHITE
    });
  }

  // ---- bursts ----
  const sparks = [];
  function burst(x,y,n){
    n = n || 26;
    for(let i=0;i<n;i++){
      const ang = Math.random()*Math.PI*2;
      const sp = rand(.6,4.2);
      sparks.push({
        x, y,
        vx: Math.cos(ang)*sp,
        vy: Math.sin(ang)*sp,
        life: 1,
        decay: rand(.012,.03),
        r: rand(.8,2.4),
        col: Math.random()<.6 ? GOLD : WHITE
      });
    }
  }

  window.addEventListener('pointerdown', function(e){
    burst(e.clientX, e.clientY);
    if(reduce) loop(); // ensure animation runs to play out the burst
  });

  let t = 0;
  function loop(){
    t += 1;
    ctx.clearRect(0,0,W,H);

    // stars
    for(const s of stars){
      if(!reduce){
        s.y -= s.vy;
        if(s.y < -2){ s.y = H+2; s.x = Math.random()*W; }
      }
      const tw = reduce ? s.a : s.a * (0.55 + 0.45*Math.sin(t*0.018*s.tw + s.ph));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${s.col[0]},${s.col[1]},${s.col[2]},${tw})`;
      ctx.shadowBlur = 6; ctx.shadowColor = `rgba(${s.col[0]},${s.col[1]},${s.col[2]},${tw*0.7})`;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // sparks
    for(let i=sparks.length-1;i>=0;i--){
      const p = sparks[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.965; p.vy = p.vy*0.965 + 0.015;
      p.life -= p.decay;
      if(p.life <= 0){ sparks.splice(i,1); continue; }
      const al = Math.max(0, p.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r*(0.4+al), 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${al})`;
      ctx.shadowBlur = 10; ctx.shadowColor = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${al})`;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    if(!reduce || sparks.length) requestAnimationFrame(loop);
  }

  if(reduce){
    // draw a static field once
    loop.__once = true;
    (function staticDraw(){
      ctx.clearRect(0,0,W,H);
      for(const s of stars){
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle = `rgba(${s.col[0]},${s.col[1]},${s.col[2]},${s.a})`;
        ctx.fill();
      }
    })();
  } else {
    requestAnimationFrame(loop);
  }

  // gentle welcome bloom from behind the portrait
  window.addEventListener('load', function(){
    if(reduce) return;
    setTimeout(function(){
      burst(W/2, H*0.42, 30);
    }, 1500);
  });

  // ---- language flip (tap / keyboard) ----
  const quote = document.getElementById('quote');
  quote.addEventListener('click', function(e){
    e.stopPropagation();
    quote.classList.toggle('is-flipped');
  });
  quote.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      quote.classList.toggle('is-flipped');
    }
  });
})();
</script>
</body>
</html>
